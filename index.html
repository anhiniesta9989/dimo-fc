<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIMO FC — Dashboard Nội Bộ</title>


<style>
:root {
  --green:#00e676; --green-dim:#00c853; --green-glow:rgba(0,230,118,.18);
  --red:#ff3d57;   --red-glow:rgba(255,61,87,.15);
  --yellow:#ffd740; --blue:#448aff; --purple:#d500f9;
  --bg:#080b0e; --bg2:#0e1318; --bg3:#141b22; --bg4:#1a232c;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --text:#dde5ee; --muted:#556070; --muted2:#8899aa;
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tahoma',Geneva,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 28px;background:rgba(8,11,14,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:44px;height:44px;border-radius:11px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name{font-family:'Tahoma',Geneva,sans-serif;font-size:28px;letter-spacing:3px;line-height:1}
.logo-sub{font-size:11px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.year-group{display:flex;align-items:center;gap:8px}
.year-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.year-tabs{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:4px}
.year-btn{padding:6px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:600;letter-spacing:.5px;transition:all .18s}
.year-btn.active{background:var(--green);color:#000;box-shadow:0 0 14px rgba(0,230,118,.4)}
.year-btn:hover:not(.active){color:var(--text);background:var(--bg4)}

/* PAGE NAV */
.page-nav{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;scrollbar-width:none}
.page-nav::-webkit-scrollbar{display:none}
.page-btn{display:flex;align-items:center;gap:7px;padding:15px 20px;border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:all .18s}
.page-btn.active{color:var(--green);border-bottom-color:var(--green)}
.page-btn:hover:not(.active){color:var(--text)}

/* LAYOUT */
.content{padding:28px;max-width:1400px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:pageIn .25s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* STAT CARDS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat-card::after{content:attr(data-glow);position:absolute;top:-30px;right:-20px;font-size:72px;opacity:.04;pointer-events:none;line-height:1}
.stat-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:10px}
.stat-val{font-family:'Tahoma',Geneva,sans-serif;font-size:34px;line-height:1;letter-spacing:1px}
.stat-val.g{color:var(--green)}.stat-val.r{color:var(--red)}.stat-val.y{color:var(--yellow)}.stat-val.b{color:var(--blue)}.stat-val.w{color:var(--text)}
.stat-sub{font-size:11.5px;color:var(--muted2);margin-top:5px}

/* SECTION TITLE */
.sec-title{font-family:'Tahoma',Geneva,sans-serif;font-size:17px;letter-spacing:2px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.card-title{font-family:'Tahoma',Geneva,sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--muted2);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);margin-bottom:28px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg3)}
th{padding:11px 16px;text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap}
td{padding:11px 16px;font-size:13px;border-top:1px solid var(--border);white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.mono{font-family:'Tahoma',Geneva,sans-serif;font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;font-family:'Tahoma',Geneva,sans-serif;letter-spacing:.5px}
.badge-w{background:rgba(0,230,118,.12);color:var(--green)}
.badge-l{background:rgba(255,61,87,.12);color:var(--red)}
.badge-d{background:rgba(255,215,64,.12);color:var(--yellow)}
.badge-ok{background:rgba(0,230,118,.10);color:var(--green)}
.badge-no{background:rgba(255,61,87,.10);color:var(--red)}

/* PROGRESS */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border:none}
.prow-name{font-size:12.5px;font-weight:500;width:82px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-bar-bg{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.prow-bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.prow-bar-fill.g{background:linear-gradient(90deg,var(--green-dim),var(--green))}
.prow-bar-fill.r{background:linear-gradient(90deg,#c62828,var(--red))}
.prow-val{font-family:'Tahoma',Geneva,sans-serif;font-size:11.5px;width:78px;text-align:right;flex-shrink:0}

/* WIN RATE BAR */
.winbar-wrap{margin:6px 0 12px}
.winbar{height:16px;display:flex;border-radius:8px;overflow:hidden;gap:2px}
.winbar-seg{height:100%;border-radius:6px;transition:width 1s ease}
.winbar-legend{display:flex;gap:20px;margin-top:8px;flex-wrap:wrap}
.winbar-legend span{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ══════════════════════════════════
   MATCH CARDS — Lịch & KQ
══════════════════════════════════ */
.matches-list{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}

.match-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  transition:border-color .2s,transform .18s;
}
.match-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.match-card.win {border-left:3px solid var(--green)}
.match-card.lose{border-left:3px solid var(--red)}
.match-card.draw{border-left:3px solid var(--yellow)}
.match-card.upcoming{border-left:3px solid var(--muted)}

/* match header row */
.mc-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;cursor:pointer;user-select:none;
}
.mc-head:hover{background:rgba(255,255,255,.02)}
.mc-num{font-family:'Tahoma',Geneva,sans-serif;font-size:11px;color:var(--muted);width:24px;flex-shrink:0}
.mc-info{flex:1;min-width:0}
.mc-venue{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.mc-venue-san{font-weight:600;color:var(--text)}
.mc-venue-sep{color:var(--muted);font-size:11px;padding:0 2px}
.mc-score-line{display:inline-flex;align-items:center;gap:5px}
.mc-team-home{font-weight:700;color:var(--text)}
.mc-team-away{font-weight:700;color:var(--green)}
.mc-score-ta  {font-family:'Tahoma',Geneva,sans-serif;font-size:22px;line-height:1}
.mc-score-dich{font-family:'Tahoma',Geneva,sans-serif;font-size:22px;line-height:1}
.mc-score-dash{font-family:'Tahoma',Geneva,sans-serif;font-size:16px;color:var(--muted);line-height:1}
.score-w{color:var(--green)}.score-l{color:var(--red)}.score-d{color:var(--yellow)}
.mc-date{font-size:11px;color:var(--muted2);margin-top:4px}
.mc-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mc-cost{font-family:'Tahoma',Geneva,sans-serif;font-size:11px;color:var(--muted)}
.mc-chevron{font-size:12px;color:var(--muted);transition:transform .2s}
.mc-chevron.open{transform:rotate(180deg)}

/* match detail panel */
.mc-detail{
  display:none;
  padding:0 18px 16px;
  border-top:1px solid var(--border);
}
.mc-detail.open{display:block;animation:fadeUp .2s ease}

/* player roster grid */
.roster-section{margin-top:14px}
.roster-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px}
.roster-grid{
  display:flex;flex-wrap:wrap;gap:6px;
}
.player-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  font-size:12px;font-weight:500;
  border:1px solid;
  transition:transform .15s;
}
.player-chip:hover{transform:scale(1.04)}
/* present (no goals) */
.chip-present{
  background:rgba(0,230,118,.08);
  border-color:rgba(0,230,118,.25);
  color:var(--green);
}
/* scorer */
.chip-scorer{
  background:rgba(255,215,64,.10);
  border-color:rgba(255,215,64,.30);
  color:var(--yellow);
}
/* absent */
.chip-absent{
  background:rgba(255,255,255,.03);
  border-color:rgba(255,255,255,.07);
  color:var(--muted);
  text-decoration:line-through;
  opacity:.5;
}
.chip-goals{
  background:rgba(255,215,64,.2);
  color:#000;
  font-weight:700;
  font-size:11px;
  border-radius:50%;
  width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.mc-meta{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.mc-meta-item{font-size:12px;color:var(--muted2)}
.mc-meta-item strong{color:var(--text)}

/* AVATAR */
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--green)}

/* MEMBER TABLE */
.member-chip{display:inline-flex;align-items:center;gap:6px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.empty .big{font-size:40px;margin-bottom:12px}

/* FOOTER */
.footer{text-align:center;padding:22px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--muted2)}

/* ANIMATIONS */
.fade-in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.d1{animation-delay:.05s}.d2{animation-delay:.10s}.d3{animation-delay:.15s}
.d4{animation-delay:.20s}.d5{animation-delay:.25s}.d6{animation-delay:.30s}

@media(max-width:600px){
  .content{padding:16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .header{padding:12px 16px}
}
</style>
</head>

const SHEET_ID = '1lw8_DGDWDezkbIO78YNLpgZ8viM0j-7qa6n_XIlOFGQ';

// Fetch CSV từ Google Sheets (public viewer)
async function fetchCSV(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}

// Parse CSV đơn giản (xử lý quoted fields)
function parseCSV(text) {
  return text.split('\n').filter(l => l.trim()).map(line => {
    const row = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { row.push(cur.trim().replace(/^"|"$/g,'')); cur = ''; }
      else cur += c;
    }
    row.push(cur.trim().replace(/^"|"$/g,''));
    return row;
  });
}

    { col: 24, name: 'Cường'      },
    { col: 25, name: 'Linh'       },
    { col: 26, name: 'Thanh'      },
    { col: 27, name: 'Dũng 90'    },
    { col: 28, name: 'Hải'        },
    { col: 29, name: 'Đạt Em'     },
    { col: 30, name: 'Phi'        },
    { col: 31, name: 'Giang'      },
    { col: 32, name: 'Luyện'      },
    { col: 33, name: 'Cảnh (GK)'  },
    { col: 34, name: 'Tuấn (GK)'  },
    { col: 35, name: 'Thông (GK)' },
    { col: 36, name: 'Khác'       },
  ];
  const playerNames = PLAYER_COLS.map(p => p.name);

  const tran = [];
  for (let i = 2; i < rows.length; i++) { // Dòng 3 trở đi = data
    const r = rows[i];
    const stt = (r[0]||'').trim();
    if (!stt || isNaN(parseInt(stt))) continue;

    const taRaw   = (r[5]||'').trim();
    const dichRaw = (r[7]||'').trim();
    const ta   = taRaw   !== '' ? parseInt(taRaw)   : null;
    const dich = dichRaw !== '' ? parseInt(dichRaw) : null;

    // Col 8 = KQ text (W/L/D), fallback tự tính từ tỉ số
    let kq = (r[8]||'').trim().toUpperCase();
    if (!['W','L','D'].includes(kq)) {
      if (ta !== null && dich !== null) kq = ta > dich ? 'W' : ta < dich ? 'L' : 'D';
      else kq = '-';
    }

    // Map cầu thủ theo đúng số cột thực tế
    const players = {};
    PLAYER_COLS.forEach(({ col, name }) => {
      const v = (r[col] || '').trim();
      if (v.toUpperCase() === 'N') players[name] = 'N';
      else if (v === '' || v === '-') players[name] = null;
      else { const n = parseInt(v); players[name] = isNaN(n) ? 0 : n; }
    });

    const nguoi = playerNames.filter(p => players[p] !== 'N' && players[p] !== null).length;

    tran.push({
      id:     parseInt(stt),
      ngay:   (r[1]||'').trim(),
      gio:    (r[2]||'').trim(),
      san:    (r[3]||'').trim(),
      doiThu: (r[4]||'').trim(),
      ta, dich, kq,
      nguoi, players,
      chi: 0
    });
  }

  return { tran, playerNames };
}

// ═══════════════════════════════════════════════
//  PARSE sheet "YEAR - Chi tiết đóng quỹ"
//  A:Ngày  B:Tên  C:Số tiền  D:Quý  E:NOTE
//  Dòng 1 = header, dòng 2–100 = data
// ═══════════════════════════════════════════════
function parseChiTiet(csv) {
  const rows = parseCSV(csv);
  const list = [];
  for (let i = 1; i <= 99 && i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const ngay = (r[0]||'').trim();
    const ten  = (r[1]||'').trim();
    const soRaw = (r[2]||'').trim().replace(/,/g,'');
    if (!ngay || !ten) continue; // bỏ hàng trống
    const so  = parseFloat(soRaw) || 0;
    const quy = (r[3]||'').trim();
    const note= (r[4]||'').trim();
    list.push({ ngay, ten, so, quy, note });
  }
  return list;
}
//  Âm quỹ:   B91:C109 → row index 90–108, col B=1, C=2
//  Chi trận: K2:AN82  → row index 1–81,   K=10,L=11,M=12,AM=38,AN=39
// ═══════════════════════════════════════════════
function parseThuChi(csv) {
  const rows = parseCSV(csv);

  // 1. Chi từng trận (K2:AN82)
  const chiTran = [];
  for (let i = 1; i <= 81; i++) {
    const r = rows[i]; if (!r) continue;
    const id      = (r[10]||'').trim();
    const diaDiem = (r[11]||'').trim();
    if (!id || isNaN(parseInt(id)) || !diaDiem) continue;
    const chi   = parseFloat((r[12]||'').replace(/,/g,'')) || 0;
    const nguoi = parseInt((r[38]||'').trim()) || 0;
    const chiTB = parseFloat((r[39]||'').replace(/,/g,'')) || 0;
    chiTran.push({ id: parseInt(id), diaDiem, chi, nguoi, chiTB });
  }

  // 2. Âm quỹ — scan từ row 85–105 để không bỏ sót
  const amList = [];
  for (let i = 85; i <= 105; i++) {
    const r = rows[i]; if (!r) continue;
    const ten   = (r[2]||'').trim();
    const soRaw = (r[1]||'').replace(/,/g,'').trim();
    if (!ten) continue;
    const so = parseFloat(soRaw);
    if (isNaN(so)) continue;
    amList.push({ ten, so });
  }
  amList.sort((a,b) => a.so - b.so);

  return { amList, chiTran };
}

function renderLichKQ(){
  const lq  = DB[currentYear].lichKQ;
  const el  = document.getElementById('page-lich-kq');
  const tran = lq.tran || [];
  const playerList = (lq.playerNames && lq.playerNames.length) ? lq.playerNames : PLAYERS;

  if (!tran.length) {
    el.innerHTML=`<div class="empty"><div class="big">📅</div>Dữ liệu năm ${currentYear} chưa được nhập.</div>`;
    return;
  }

  // Parse ngày "04 Jan 26" → Date
  const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  function parseNgay(str) {
    if (!str) return null;
    const p = str.trim().split(' ');
    if (p.length < 3) return null;
    return new Date(2000+parseInt(p[2]), MONTHS[p[1]], parseInt(p[0]));
  }

  const today = new Date(); today.setHours(0,0,0,0);

  // 2 nhóm: sắp tới (tương lai) và kết quả (quá khứ/hôm nay)
  const upcoming = tran.filter(t => { const d=parseNgay(t.ngay); return d && d > today && t.gio; });
  const results  = tran.filter(t => { const d=parseNgay(t.ngay); return d && d <= today; });

  upcoming.sort((a,b) => (parseNgay(a.ngay)||0)-(parseNgay(b.ngay)||0)); // gần nhất lên đầu
  results.sort((a,b)  => (parseNgay(b.ngay)||0)-(parseNgay(a.ngay)||0)); // mới nhất lên đầu

  // Thống kê chỉ tính trận có tỉ số
  const played   = results.filter(t => t.ta !== null && t.dich !== null);
  const thang    = played.filter(t => t.kq==='W').length;
  const hoa      = played.filter(t => t.kq==='D').length;
  const thua     = played.filter(t => t.kq==='L').length;
  const tongTran = played.length;
  const banThang = played.reduce((s,t)=>s+(t.ta||0),0);
  const banThua  = played.reduce((s,t)=>s+(t.dich||0),0);
  const hieuSo   = banThang - banThua;
  const pctW = tongTran ? Math.round(thang/tongTran*100) : 0;
  const pctD = tongTran ? Math.round(hoa/tongTran*100)   : 0;
  const pctL = 100 - pctW - pctD;

  // Top ghi bàn
  const scoreMap = {};
  played.forEach(t => playerList.forEach(p => {
    if (typeof t.players[p]==='number' && t.players[p]>0)
      scoreMap[p] = (scoreMap[p]||0) + t.players[p];
  }));
  const topScorers = Object.entries(scoreMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Card sắp tới — chỉ hiển thị nếu có giờ cụ thể
  function upcomingCard(t) {
    return `
      <div class="match-card upcoming">
        <div class="mc-head">
          <span class="mc-num">${t.id}</span>
          <div class="mc-info">
            <div class="mc-venue">
              <span style="font-size:12px;font-weight:600;color:var(--text);background:var(--bg3);border-radius:5px;padding:2px 7px">⏰ ${t.gio}</span>
              <span class="mc-venue-sep">·</span>
              <span class="mc-venue-san">🏟️ ${t.san}</span>
              ${t.doiThu?`<span class="mc-venue-sep">·</span><span class="mc-team-away">vs ${t.doiThu}</span>`:''}
            </div>
            <div class="mc-date">📅 ${t.ngay}</div>
          </div>
          <div class="mc-right"><span class="badge badge-up">📆 Sắp diễn ra</span></div>
        </div>
      </div>`;
  }

  // Card kết quả — có tỉ số hoặc "Đang cập nhật"
  function resultCard(t) {
    const hasScore = t.ta !== null && t.dich !== null;

    if (!hasScore) return `
      <div class="match-card upcoming">
        <div class="mc-head">
          <span class="mc-num">${t.id}</span>
          <div class="mc-info">
            <div class="mc-venue">
              ${t.gio?`<span style="font-size:12px;font-weight:600;color:var(--text);background:var(--bg3);border-radius:5px;padding:2px 7px">⏰ ${t.gio}</span><span class="mc-venue-sep">·</span>`:''}
              <span class="mc-venue-san">🏟️ ${t.san}</span>
              ${t.doiThu?`<span class="mc-venue-sep">·</span><span class="mc-team-away">vs ${t.doiThu}</span>`:''}
            </div>
            <div class="mc-date">📅 ${t.ngay}</div>
          </div>
          <div class="mc-right"><span class="badge" style="background:rgba(255,215,64,.12);color:var(--yellow)">⏳ Đang cập nhật</span></div>
        </div>
      </div>`;

    const players     = t.players || {};
    const regularList = playerList.filter(p => p !== 'Khác');
    const presentList = regularList.filter(p => players[p] !== 'N' && players[p] !== null);
    const absentList  = regularList.filter(p => players[p] === 'N');
    const scorers     = regularList.filter(p => typeof players[p]==='number' && players[p]>0);
    const khacGoals   = typeof players['Khác']==='number' && players['Khác']>0 ? players['Khác'] : 0;
    const hasRoster   = presentList.length > 0;
    const taWin = t.ta > t.dich, dichWin = t.dich > t.ta;

    return `
      <div class="match-card ${kqCls(t.kq)}">
        <div class="mc-head" onclick="toggleMatch(${t.id})">
          <span class="mc-num">${t.id}</span>
          <div class="mc-info">
            <div class="mc-venue">
              ${t.gio?`<span style="font-size:12px;font-weight:600;color:var(--text);background:var(--bg3);border-radius:5px;padding:2px 7px">⏰ ${t.gio}</span><span class="mc-venue-sep">·</span>`:''}
              <span class="mc-venue-san">🏟️ ${t.san}</span>
              <span class="mc-venue-sep">·</span>
              <span class="mc-score-line">
                <span class="mc-team-home">DIMO FC</span>
                <span class="mc-score-ta ${taWin?'score-w':dichWin?'score-l':'score-d'}">${t.ta}</span>
                <span class="mc-score-dash">-</span>
                <span class="mc-score-dich ${dichWin?'score-w':taWin?'score-l':'score-d'}">${t.dich}</span>
                <span class="mc-team-away">${t.doiThu||'Đối thủ'}</span>
              </span>
            </div>
            <div class="mc-date">📅 ${t.ngay}${t.nguoi>0?' · 👥 '+t.nguoi+' người':''}</div>
          </div>
          <div class="mc-right">
            ${kqBadge(t.kq)}
            <span class="mc-chevron" id="mc-${t.id}">▾</span>
          </div>
        </div>
        <div class="mc-detail" id="md-${t.id}">
          ${!hasRoster ? `<div style="padding:12px 0;color:var(--yellow);font-size:13px">⏳ Đang cập nhật thông tin đội hình & ghi bàn...</div>` : `
            <div style="display:flex;gap:20px;flex-wrap:wrap;padding:6px 0 2px">
              <span style="font-size:12px;color:var(--muted2)">👥 <strong style="color:var(--text)">${presentList.length}</strong> có mặt</span>
              ${(scorers.length||khacGoals)?`<span style="font-size:12px;color:var(--muted2)">⚽ <strong style="color:var(--yellow)">${scorers.reduce((s,p)=>s+(players[p]||0),0)+khacGoals}</strong> bàn ghi nhận</span>`:''}
            </div>
            ${(scorers.length||khacGoals)?`
            <div class="roster-section">
              <div class="roster-label">⚽ Ghi bàn</div>
              <div class="roster-grid">
                ${scorers.map(p=>`<div class="player-chip chip-scorer">${p} (${players[p]})</div>`).join('')}
                ${khacGoals?`<div class="player-chip" style="background:rgba(136,153,170,.1);border-color:rgba(136,153,170,.25);color:var(--muted2)">Người ngoài (${khacGoals})</div>`:''}
              </div>
            </div>`:''}
            <div class="roster-section">
              <div class="roster-label">✅ Có mặt (${presentList.length})</div>
              <div class="roster-grid">${presentList.map(p=>`<div class="player-chip chip-present">${p}</div>`).join('')}</div>
            </div>
            ${absentList.length?`
            <div class="roster-section">
              <div class="roster-label">❌ Vắng mặt (${absentList.length})</div>
              <div class="roster-grid">${absentList.map(p=>`<div class="player-chip chip-absent">${p}</div>`).join('')}</div>
            </div>`:''}
          `}
        </div>
      </div>`;
  }

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card fade-in d1" data-glow="🏆"><div class="stat-label">Tổng Trận</div><div class="stat-val w">${tongTran}</div><div class="stat-sub">Mùa ${currentYear}</div></div>
      <div class="stat-card fade-in d2" data-glow="✅"><div class="stat-label">Thắng</div><div class="stat-val g">${thang}</div><div class="stat-sub">${pctW}%</div></div>
      <div class="stat-card fade-in d3" data-glow="🤝"><div class="stat-label">Hòa</div><div class="stat-val y">${hoa}</div><div class="stat-sub">${pctD}%</div></div>
      <div class="stat-card fade-in d4" data-glow="❌"><div class="stat-label">Thua</div><div class="stat-val r">${thua}</div><div class="stat-sub">${pctL}%</div></div>
      <div class="stat-card fade-in d5" data-glow="⚽"><div class="stat-label">Bàn Thắng</div><div class="stat-val g">${banThang}</div><div class="stat-sub">${tongTran?(banThang/tongTran).toFixed(1):0} BT/trận</div></div>
      <div class="stat-card fade-in d6" data-glow="🥅"><div class="stat-label">Bàn Thua</div><div class="stat-val r">${banThua}</div><div class="stat-sub">Hiệu số ${hieuSo>=0?'+':''}${hieuSo}</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">📊 TỈ LỆ KẾT QUẢ MÙA ${currentYear}</div>
        ${tongTran === 0 ? '<div style="color:var(--muted);font-size:13px">Chưa có dữ liệu</div>' : (() => {
          // SVG donut chart
          const r = 54, cx = 70, cy = 70, stroke = 16;
          const circ = 2 * Math.PI * r;
          const wPct = thang/tongTran, dPct = hoa/tongTran, lPct = thua/tongTran;
          const gap = 0.02; // gap giữa các phần
          const wLen = Math.max(0, circ * wPct - gap*circ);
          const dLen = Math.max(0, circ * dPct - gap*circ);
          const lLen = Math.max(0, circ * lPct - gap*circ);
          const wOff = 0;
          const dOff = -(circ * wPct);
          const lOff = -(circ * (wPct + dPct));
          return `
          <div style="display:flex;align-items:center;gap:24px">
            <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">
              <!-- background ring -->
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="${stroke}"/>
              <!-- Thắng -->
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
                stroke="#00e676" stroke-width="${stroke}" stroke-linecap="round"
                stroke-dasharray="${wLen} ${circ}"
                stroke-dashoffset="${wOff}"
                transform="rotate(-90 ${cx} ${cy})"/>
              <!-- Hòa -->
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
                stroke="#ffd740" stroke-width="${stroke}" stroke-linecap="round"
                stroke-dasharray="${dLen} ${circ}"
                stroke-dashoffset="${dOff}"
                transform="rotate(-90 ${cx} ${cy})"/>
              <!-- Thua -->
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
                stroke="#ff3d57" stroke-width="${stroke}" stroke-linecap="round"
                stroke-dasharray="${lLen} ${circ}"
                stroke-dashoffset="${lOff}"
                transform="rotate(-90 ${cx} ${cy})"/>
              <!-- center text -->
              <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="var(--text)"
                style="font-family:'Tahoma',Geneva,sans-serif;font-size:22px;letter-spacing:1px">${pctW}%</text>
              <text x="${cx}" y="${cy + 10}" text-anchor="middle" fill="var(--muted2)"
                style="font-size:10px;font-family:'Tahoma',Geneva,sans-serif">Thắng</text>
              <text x="${cx}" y="${cy + 24}" text-anchor="middle" fill="var(--muted)"
                style="font-size:9px;font-family:'Tahoma',Geneva,sans-serif">${tongTran} trận</text>
            </svg>
            <div style="display:flex;flex-direction:column;gap:12px;flex:1">
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0"></div>
                <div style="flex:1;font-size:13px;font-weight:500">Thắng</div>
                <div style="font-family:'Tahoma',Geneva,sans-serif;font-size:20px;color:var(--green)">${thang}</div>
                <div style="font-size:11px;color:var(--muted);width:36px;text-align:right">${pctW}%</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:10px;height:10px;border-radius:50%;background:var(--yellow);flex-shrink:0"></div>
                <div style="flex:1;font-size:13px;font-weight:500">Hòa</div>
                <div style="font-family:'Tahoma',Geneva,sans-serif;font-size:20px;color:var(--yellow)">${hoa}</div>
                <div style="font-size:11px;color:var(--muted);width:36px;text-align:right">${pctD}%</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0"></div>
                <div style="flex:1;font-size:13px;font-weight:500">Thua</div>
                <div style="font-family:'Tahoma',Geneva,sans-serif;font-size:20px;color:var(--red)">${thua}</div>
                <div style="font-size:11px;color:var(--muted);width:36px;text-align:right">${pctL}%</div>
              </div>
            </div>
          </div>`;
        })()}
      </div>
      <div class="card">
        <div class="card-title">🏅 TOP GHI BÀN MÙA ${currentYear}</div>
        ${topScorers.length ? topScorers.map(([name,goals],i)=>`
          <div class="prow">
            <div class="prow-name">${i+1}. ${name}</div>
            <div class="prow-bar-bg"><div class="prow-bar-fill g" style="width:${goals/topScorers[0][1]*100}%"></div></div>
            <div class="prow-val pos">${goals} bàn</div>
          </div>`).join('') : '<div style="color:var(--muted);font-size:13px">Chưa có dữ liệu</div>'}
      </div>
    </div>

    <div class="sec-title">LỊCH THI ĐẤU SẮP TỚI</div>
    <div class="matches-list">
      ${upcoming.length
        ? upcoming.map(upcomingCard).join('')
        : `<div style="color:var(--muted);font-size:13px;padding:16px 4px">Đang chờ book lịch</div>`}
    </div>

    <div class="sec-title">KẾT QUẢ THI ĐẤU — Mới nhất</div>
    <div class="matches-list">${results.map(resultCard).join('')}</div>`;
}

// ═══════════════════════════════════════════════
//  PAGE 3 — CHI TIẾT ĐÓNG QUỸ (realtime)
// ═══════════════════════════════════════════════
function renderDongQuy(){
  const el  = document.getElementById('page-dong-quy');
  const tc2 = DB[currentYear].thuChi2;

  if (!tc2 || !tc2.amList) {
    el.innerHTML=`<div class="empty"><div class="big">📋</div>Dữ liệu năm ${currentYear} chưa được nhập.</div>`;
    return;
  }

  const amList = tc2.amList;
  if (!amList.length) {
    el.innerHTML=`<div class="empty"><div class="big">🎉</div>Không có thành viên nào âm quỹ!</div>`;
    return;
  }

  const tongNo  = amList.reduce((s,m) => s + m.so, 0);
  const maxAm   = Math.abs(amList[0].so) || 1;
  const chiTiet = DB[currentYear].chiTiet || [];

  // Group theo tên để tính tổng mỗi người
  const tongMap = {};
  chiTiet.forEach(r => {
    tongMap[r.ten] = (tongMap[r.ten]||0) + r.so;
  });

  el.innerHTML=`
    <div class="stats-row">
      <div class="stat-card fade-in d1" data-glow="⚠">
        <div class="stat-label">Thành Viên Nợ</div>
        <div class="stat-val r">${amList.length}</div>
        <div class="stat-sub">Số dư âm</div>
      </div>
      <div class="stat-card fade-in d2" data-glow="💸">
        <div class="stat-label">Tổng Nợ</div>
        <div class="stat-val r">${short(tongNo)}</div>
        <div class="stat-sub">Cần thu thêm</div>
      </div>
      <div class="stat-card fade-in d3" data-glow="📋">
        <div class="stat-label">Số Lần Đóng</div>
        <div class="stat-val b">${chiTiet.length}</div>
        <div class="stat-sub">Giao dịch ${currentYear}</div>
      </div>
      <div class="stat-card fade-in d4" data-glow="💰">
        <div class="stat-label">Tổng Đã Thu</div>
        <div class="stat-val g">${short(chiTiet.reduce((s,r)=>s+r.so,0))}</div>
        <div class="stat-sub">Năm ${currentYear}</div>
      </div>
    </div>

    <div class="sec-title">DANH SÁCH ÂM QUỸ — ${currentYear}</div>
    <div class="card" style="margin-bottom:28px">
      ${amList.map((m, i) => `
        <div class="prow">
          <div style="font-size:11px;color:var(--muted);width:24px;flex-shrink:0">${i+1}</div>
          <div class="prow-name" style="width:100px" title="${m.ten}">${m.ten}</div>
          <div class="prow-bar-bg">
            <div class="prow-bar-fill r" style="width:${Math.abs(m.so)/maxAm*100}%"></div>
          </div>
          <div class="prow-val neg">${vnd(m.so)}</div>
        </div>`).join('')}
    </div>

    <div class="sec-title">CHI TIẾT ĐÓNG QUỸ TỪNG NGƯỜI — ${currentYear}</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Ngày</th>
            <th>Tên</th>
            <th>Số Tiền</th>
            <th>Quý</th>
            <th>Ghi Chú</th>
          </tr>
        </thead>
        <tbody>
          ${chiTiet.map((r, i) => `
            <tr>
              <td style="color:var(--muted);font-size:11px">${i+1}</td>
              <td style="color:var(--muted2);font-size:12px">📅 ${r.ngay}</td>
              <td style="font-weight:600">${r.ten}</td>
              <td style="color:var(--green);font-weight:600">${vnd(r.so)}</td>
              <td style="color:var(--muted2)">Q${r.quy||'—'}</td>
              <td style="color:var(--muted2);font-size:12px">${r.note||'—'}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr style="background:var(--bg3)">
            <td colspan="3" style="font-weight:600;color:var(--muted2)">TỔNG ĐÃ THU</td>
            <td style="color:var(--green);font-weight:700">${vnd(chiTiet.reduce((s,r)=>s+r.so,0))}</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

// ─── BOOT ──────────────────────────────────────
initYearTabs();
renderAll();
</script>
</body>
</html>
