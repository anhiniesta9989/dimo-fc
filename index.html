<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIMO FC — Dashboard Nội Bộ</title>
<!-- Google Analytics GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RKWCT26RBY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RKWCT26RBY');
</script>
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/anhiniesta9989/dimo-fc/main/logo-dimo-fc.jpg">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header class="header">
  <div class="logo">
    <div class="logo-icon"><img src="https://raw.githubusercontent.com/anhiniesta9989/dimo-fc/main/logo-dimo-fc.jpg" style="width:40px;height:40px;object-fit:contain;border-radius:8px"></div>
    <div>
      <div class="logo-name">DIMO FC</div>
      <div class="logo-sub">Dashboard Nội Bộ</div>
    </div>
  </div>
  <div class="year-group">
    <span class="year-label">Năm</span>
    <div class="year-tabs" id="yearTabs"></div>
  </div>
  <!-- <button class="dangky-btn" onclick="openDangKy()">🏆 Đăng ký giải</button> -->
</header>

<nav class="page-nav">
  <button class="page-btn active" onclick="setPage('lich-kq',this)"><span>📅</span> Lịch &amp; Kết Quả</button>
  <button class="page-btn"        onclick="setPage('thu-chi',this)"><span>💰</span> Quỹ Đội</button>
  <button class="page-btn"        onclick="setPage('dong-quy',this)"><span>📋</span> Chi Tiết Đóng Quỹ</button>
  <button class="page-btn"        onclick="setPage('thanh-vien',this)"><span>👥</span> Thành Viên</button>
</nav>

<main class="content">
  <section id="page-lich-kq"    class="page active"></section>
  <section id="page-thu-chi"    class="page"></section>
  <section id="page-dong-quy"   class="page"></section>
  <section id="page-thanh-vien" class="page"></section>
</main>

<footer class="footer">
  ⚽ DIMO FC Dashboard &nbsp;·&nbsp;
  <a href="https://docs.google.com/spreadsheets/d/1lw8_DGDWDezkbIO78YNLpgZ8viM0j-7qa6n_XIlOFGQ" target="_blank">Google Sheets</a>
</footer>

<!-- MODAL ĐĂNG KÝ GIẢI -->
<div class="modal-overlay" id="modalDangKy">
  <div class="modal">
    <div class="modal-title">🏆 Đăng Ký Đá Giải</div>
    <div>
      <div class="modal-label">Tên giải đấu *</div>
      <input type="text" id="tenGiai" placeholder="Nhập tên giải đấu...">
    </div>
    <div>
      <div class="modal-label">Chọn cầu thủ tham gia</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button onclick="chonTatCa(true)"  style="padding:4px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--muted2);font-size:11px;cursor:pointer">Chọn tất cả</button>
        <button onclick="chonTatCa(false)" style="padding:4px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--muted2);font-size:11px;cursor:pointer">Bỏ chọn</button>
      </div>
      <div class="player-check-grid" id="playerCheckList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDangKy()">Huỷ</button>
      <button class="btn-export" onclick="exportPDF()">📄 Đăng ký & Xuất PDF</button>
    </div>
  </div>
</div>

<!-- JS: thứ tự load quan trọng -->
<script src="js/config.js"></script>
<script src="js/parse.js"></script>
<script src="js/ui.js"></script>
<script src="js/render-thu-chi.js"></script>
<script src="js/render-lich-kq.js"></script>
<script src="js/render-dong-quy.js"></script>
<script src="js/render-thanh-vien.js"></script>
<script src="js/dang-ky-giai.js"></script>
</body>
</html>
